name: Build K40 Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: '添加KSU支持'
        required: false
        default: 'true'
      config_path:
        description: '内核配置文件路径（如果不需要KSU则忽略）/一般默认即可'
        required: false
        type: string
        default: 'arch/arm64/configs/'
      kernel_tag:
        description: '内核代码分支/Tag'
        required: false
        type: string
        default: 'master'
      config_name:
        description: '内核编译配置文件名'
        required: false
        type: string
        default: 'alioth_hylab_defconfig'
      git_url:
        description: '内核仓库地址'
        required: false
        type: string
        default: 'https://github.com/zfdx123/kernel_xiaomi_alioth.git'
      clang_url:
        description: '编译器下载地址'
        required: false
        type: string
        default: 'https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz'

jobs:

  build_kernel:

    name: Build K40 Kernel

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: master
          fetch-depth: 0

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libc6-dev-i386 libncurses6 libncursesw6 lib32ncurses-dev lib32ncurses6 lib32ncursesw6 libncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev unzip fontconfig make python2
          sudo -E apt-get -qq install libfuse-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Init Config
        id: init_config
        run: |
          processed_name=$(echo ${{ inputs.config_name }} | awk -F'/' '{ if (NF > 1) print $NF; else print $0 }')
          echo "processed_name=$(echo $processed_name)" >> $GITHUB_OUTPUT

      - name: Install Clang
        run: |
          mkdir clang
          wget ${{ inputs.clang_url }}
          tar -C clang/ -zxvf *.tar.gz
      
      - name: Clone Kernel
        run: |
          git clone --depth=1 -b ${{ inputs.kernel_tag }} ${{ inputs.git_url }} kernel-source
          
      - name: Support KernelSU and Droidspaces
        if: github.event.inputs.ksu == 'true'
        run: |
          git clone https://github.com/ReSukiSU/ReSukiSU kernel-source/KernelSU
          cd kernel-source
          
          # KernelSU 基础配置
          echo "CONFIG_KPROBES=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_HAVE_KPROBES=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_KPROBE_EVENTS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          
          # Droidspaces 必要配置追加 (非GKI 4.19架构)
          echo "CONFIG_SYSCTL=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_SYSVIPC=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_POSIX_MQUEUE=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NAMESPACES=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_PID_NS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_UTS_NS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_IPC_NS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_SECCOMP=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_SECCOMP_FILTER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_CGROUPS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_CGROUP_DEVICE=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_CGROUP_PIDS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_MEMCG=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_CGROUP_SCHED=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_FAIR_GROUP_SCHED=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_CGROUP_FREEZER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_CGROUP_NET_PRIO=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_DEVTMPFS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_OVERLAY_FS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_TMPFS_XATTR=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_FW_LOADER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_FW_LOADER_USER_HELPER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_FW_LOADER_COMPRESS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NET_NS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_VETH=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_BRIDGE=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NETFILTER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_BRIDGE_NETFILTER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NETFILTER_ADVANCED=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NF_CONNTRACK=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_IP_NF_IPTABLES=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_IP_NF_FILTER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NF_NAT=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NF_TABLES=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NF_CONNTRACK_NETLINK=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NF_NAT_REDIRECT=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_IP_ADVANCED_ROUTER=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_IP_MULTIPLE_TABLES=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NF_CONNTRACK_IPV4=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_NF_NAT_IPV4=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          echo "CONFIG_IP_NF_NAT=y" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          
          # 禁用偏执网络限制，防止容器内无网
          echo "CONFIG_ANDROID_PARANOID_NETWORK=n" >> ${{ inputs.config_path }}${{ inputs.config_name }}
          
          git config --global user.email "robot@example.com"
          git config --global user.name "robot"
          git add ${{ inputs.config_path }}${{ inputs.config_name }}
          git commit -m "Add KSU and Droidspaces configs"
          sh ./KernelSU/kernel/setup.sh

      - name: Make
        run: |
          export ClangHome=$(pwd)/clang
          export PATH=${ClangHome}/bin:${PATH}
          cd kernel-source
          make LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld ${{ inputs.config_name }}
          make -j$(nproc) LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KBUILD_BUILD_USER=hylab KBUILD_BUILD_HOST=localhost

      - name: Patch Boot
        run: |
          chmod +x ./magiskboot
          unzip boot.zip
          cp -rf kernel-source/out/arch/arm64/boot/* .
          ./magiskboot unpack boot.img
          rm -rf kernel
          cp -rf kernel-source/out/arch/arm64/boot/Image ./kernel
          ./magiskboot repack boot.img
          rm -rf ramdisk.cpio boot.img

      - name: Zip
        run: |
          # 修复打包：将服务器重构好的 new-boot.img 命名为 ksu-boot.img 一起打包输出
          cp new-boot.img ksu-boot.img
          zip -r -9 -o Kernel.zip dtbo.img Image ksu-boot.img

      - name: Kernel REL
        uses: actions/upload-artifact@main
        with:
          name: ${{ steps.init_config.outputs.processed_name }} KernelSU
          path: ./Kernel.zip