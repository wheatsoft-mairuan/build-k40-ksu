name: Build K40 Kernel

# 记录实际使用的 base commit，便于打包 boot.img 时追溯
run-name: Build K40 Kernel (base ${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: '【已废弃】KernelSU 集成已移除，此开关不再生效（APatch 直接修补 boot.img）'
        required: false
        default: 'false'
      config_path:
        description: '内核配置文件路径'
        required: false
        type: string
        default: 'arch/arm64/configs/'
      kernel_tag:
        description: '内核代码分支/Tag'
        required: false
        type: string
        default: 'master'
      config_name:
        description: '内核编译配置文件名'
        required: false
        type: string
        default: 'alioth_hylab_defconfig'
      git_url:
        description: '内核仓库地址'
        required: false
        type: string
        default: 'https://github.com/zfdx123/kernel_xiaomi_alioth.git'
      clang_url:
        description: '编译器下载地址'
        required: false
        type: string
        default: 'https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz'

jobs:

  build_kernel:

    name: Build K40 Kernel

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: master
          fetch-depth: 0

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libc6-dev-i386 libncurses6 libncursesw6 lib32ncurses-dev lib32ncurses6 lib32ncursesw6 libncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev unzip fontconfig make python2 python3 patch
          sudo -E apt-get -qq install libfuse-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Init Config
        id: init_config
        run: |
          processed_name=$(echo ${{ inputs.config_name }} | awk -F'/' '{ if (NF > 1) print $NF; else print $0 }')
          echo "processed_name=$(echo $processed_name)" >> $GITHUB_OUTPUT
          echo "config_file=${{ inputs.config_path }}${{ inputs.config_name }}" >> $GITHUB_OUTPUT

      - name: Install Clang
        run: |
          mkdir clang
          wget ${{ inputs.clang_url }}
          tar -C clang/ -zxvf *.tar.gz

      - name: Clone Kernel
        run: |
          git clone --depth=1 -b ${{ inputs.kernel_tag }} ${{ inputs.git_url }} kernel-source
          cd kernel-source
          echo "kernel HEAD = $(git rev-parse HEAD)"

      # ============================================================
      # Droidspaces：应用官方 non-GKI kABI 补丁
      # 说明：必须打在内核源码根目录（single-tree layout），不能放进 common/。
      # 补丁来源：ravindu644/Droidspaces-OSS
      #   Documentation/resources/kernel-patches/non-GKI/
      # 作用：在不改变 task_struct 内存偏移（不破坏 kABI）的前提下，
      #       让 CONFIG_SYSVIPC / CONFIG_IPC_NS 可以安全启用，避免卡第一屏。
      # ============================================================
      - name: Apply Droidspaces kABI Patch
        run: |
          set -eux
          DS_PATCH_BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI"
          PATCH_DIR="$RUNNER_TEMP/ds-patches"
          mkdir -p "$PATCH_DIR"

          # 补丁 1：修复 xt_qtaguid 在不活跃接口上调用 dev_get_stats 导致的内核 panic
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "$PATCH_DIR/01.patch" \
            "$DS_PATCH_BASE/01.fix_kernel_panic_in_xt_qtaguid.patch"

          # 补丁 2：恢复 cgroup 文件前缀处理（Droidspaces/LXC 兼容性）
          #         注意文件名本身带空格，URL 中为 %20，保存为无空格文件名
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "$PATCH_DIR/02.patch" \
            "$DS_PATCH_BASE/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"

          # 统一换行符：内核树内部分文件是 CRLF，补丁是 LF，否则会被当作 whitespace 错误拒绝
          sed -i 's/\r$//' "$PATCH_DIR/01.patch" "$PATCH_DIR/02.patch"

          cd kernel-source

          # 目标文件是否存在的判断依据从补丁里解析，不生效就跳过：
          # alioth 4.19 内核已移除 xt_qtaguid 模块，01 补丁对其为空操作（不是失败）。
          # 不要在 git 仓库里执行无参 patch，否则它会交互式询问 "File to patch:" 而挂住。
          apply_patch() {
            p="$1"
            tgt=$(grep -m1 '^+++ b/' "$p" | sed 's|^+++ b/||; s/\t.*$//')
            if [ ! -e "$tgt" ]; then
              echo "SKIP: $(basename "$p") — 目标文件不存在: $tgt（该内核无此模块，补丁不适用）"
              return 0
            fi
            echo "=== applying $(basename "$p") -> $tgt ==="
            if git apply --check -v "$p" 2>/dev/null; then
              git apply -v "$p"
            elif git apply --check --3way -v "$p" 2>/dev/null; then
              git apply --3way -v "$p"
            else
              # 兜底：patch 的 fuzz 更宽松，并显式 --batch 避免任何交互式提问
              patch -p1 --forward --batch --no-backup-if-mismatch < "$p" \
                || echo "WARN: $(basename "$p") 可能已应用或存在 fuzz，继续编译"
            fi
          }
          apply_patch "$PATCH_DIR/01.patch"
          apply_patch "$PATCH_DIR/02.patch"

          echo "=== kABI patch applied, diff stat ==="
          git --no-pager diff --stat

          # cgroup 前缀补丁是 Droidspaces 的核心补丁，必须真正应用成功，否则直接失败
          if ! grep -q "CGRP_ROOT_NOPREFIX" kernel/cgroup/cgroup.c; then
            echo "ERROR: 02 补丁（cgroup file prefix handling）未生效，Droidspaces 兼容性无法保证"
            exit 1
          fi
          echo "OK: cgroup 前缀处理补丁已确认生效"

      # ============================================================
      # 追加 Droidspaces / APatch 所需内核配置
      # 配置项来源：Droidspaces 官方 Documentation/Kernel-Configuration.md
      #             + APatch 官方安装文档（CONFIG_KALLSYMS）
      # ============================================================
      - name: Append Droidspaces Config
        run: |
          set -eux
          cd kernel-source
          CONFIG_FILE="${{ steps.init_config.outputs.config_file }}"
          test -f "$CONFIG_FILE" || { echo "找不到内核配置文件: $CONFIG_FILE"; exit 1; }

          if grep -q "Droidspaces Required Configs" "$CONFIG_FILE"; then
            echo "配置已存在，跳过追加"
          else
            # 注意：这里用循环 echo 而不是 heredoc。
            # YAML 的 run: | 会保留缩进，heredoc 会把每行前面的空格一起写进
            # defconfig，导致 CONFIG_* 无法被 Kconfig 识别。
            for line in \
              "" \
              "# === Droidspaces Required Configs ===" \
              "CONFIG_SYSCTL=y" \
              "CONFIG_SYSVIPC=y" \
              "CONFIG_POSIX_MQUEUE=y" \
              "CONFIG_NAMESPACES=y" \
              "CONFIG_PID_NS=y" \
              "CONFIG_UTS_NS=y" \
              "CONFIG_IPC_NS=y" \
              "CONFIG_SECCOMP=y" \
              "CONFIG_SECCOMP_FILTER=y" \
              "CONFIG_CGROUPS=y" \
              "CONFIG_CGROUP_DEVICE=y" \
              "CONFIG_CGROUP_SCHED=y" \
              "CONFIG_FAIR_GROUP_SCHED=y" \
              "CONFIG_CGROUP_FREEZER=y" \
              "CONFIG_CGROUP_NET_PRIO=y" \
              "CONFIG_MEMCG=y" \
              "CONFIG_CFS_BANDWIDTH=y" \
              "CONFIG_CGROUP_PIDS=y" \
              "CONFIG_CGROUP_CPUACCT=y" \
              "CONFIG_DEVTMPFS=y" \
              "CONFIG_OVERLAY_FS=y" \
              "CONFIG_TMPFS_POSIX_ACL=y" \
              "CONFIG_TMPFS_XATTR=y" \
              "CONFIG_FW_LOADER=y" \
              "CONFIG_FW_LOADER_USER_HELPER=y" \
              "CONFIG_FW_LOADER_COMPRESS=y" \
              "CONFIG_NET_NS=y" \
              "CONFIG_VETH=y" \
              "CONFIG_BRIDGE=y" \
              "CONFIG_NETFILTER=y" \
              "CONFIG_BRIDGE_NETFILTER=y" \
              "CONFIG_NETFILTER_ADVANCED=y" \
              "CONFIG_NF_CONNTRACK=y" \
              "CONFIG_IP_NF_IPTABLES=y" \
              "CONFIG_IP_NF_FILTER=y" \
              "CONFIG_NF_NAT=y" \
              "CONFIG_NF_TABLES=y" \
              "CONFIG_IP_NF_TARGET_MASQUERADE=y" \
              "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y" \
              "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y" \
              "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" \
              "# === APatch Required Configs ===" \
              "CONFIG_KALLSYMS=y" \
              "CONFIG_KALLSYMS_ALL=y" \
              "# === /proc/config.gz support (方便刷机后核对配置) ===" \
              "CONFIG_IKCONFIG=y" \
              "CONFIG_IKCONFIG_PROC=y"; do
              echo "$line" >> "$CONFIG_FILE"
            done
          fi

          echo "=== 追加后的配置尾部 ==="
          tail -n 45 "$CONFIG_FILE"

      - name: Make
        run: |
          export ClangHome=$(pwd)/clang
          export PATH=${ClangHome}/bin:${PATH}
          cd kernel-source
          make LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld ${{ inputs.config_name }}
          make -j$(nproc) LLVM=1 LLVM_IAS=1 O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KBUILD_BUILD_USER=hylab KBUILD_BUILD_HOST=localhost

      # 编译后用真实的 .config 复核关键项（defconfig 里的 =y 可能因 Kconfig
      # 依赖不满足而被丢弃，必须在这里 fail-fast，避免刷进去之后才发现）
      - name: Verify Kernel Config
        run: |
          set -eux
          CFG="kernel-source/out/.config"
          test -f "$CFG" || { echo "找不到 $CFG"; exit 1; }

          echo "=== 关键配置检查 ==="
          CHECK="CONFIG_SYSVIPC CONFIG_IPC_NS CONFIG_NAMESPACES CONFIG_NET_NS CONFIG_PID_NS CONFIG_UTS_NS CONFIG_CGROUPS CONFIG_KALLSYMS"
          FAIL=0
          for k in $CHECK; do
            if grep -q "^${k}=y" "$CFG"; then
              echo "OK   ${k}=y"
            else
              echo "FAIL ${k} 未启用"
              FAIL=1
            fi
          done

          echo "=== 详细值 ==="
          grep -E "^(CONFIG_SYSVIPC|CONFIG_IPC_NS|CONFIG_NAMESPACES|CONFIG_NET_NS|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_ANDROID_PARANOID_NETWORK|CONFIG_IKCONFIG|CONFIG_IKCONFIG_PROC)=" "$CFG" || true

          if [ "$FAIL" -ne 0 ]; then
            echo "存在未启用的关键配置，终止打包"
            exit 1
          fi

      - name: Patch Boot
        run: |
          chmod +x ./magiskboot
          unzip boot.zip
          cp -rf kernel-source/out/arch/arm64/boot/* .
          ./magiskboot unpack boot.img
          rm -rf kernel
          cp -rf kernel-source/out/arch/arm64/boot/Image ./kernel
          ./magiskboot repack boot.img
          rm -rf ramdisk.cpio

      - name: Zip
        run:
          zip -r -9 -o Kernel.zip dtbo.img Image boot.img

      - name: Kernel REL
        uses: actions/upload-artifact@main
        with:
          name: ${{ steps.init_config.outputs.processed_name }}-Droidspaces-APatch
          path: ./Kernel.zip
